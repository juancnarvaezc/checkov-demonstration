name: Checkov
on:
    push:
        branches:
            - main
            - test
        paths:
            - "terraform/**"
    pull_request:
        branches:
            - main
            - test
        paths:
            - "terraform/**"
permissions:
    contents: read

jobs:
    checkov:
        name: checkov-security-scan
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repo
              uses: actions/checkout@v6

            - name: Checkov security scan
              uses: bridgecrewio/checkov-action@v12
              with:
                  directory: terraform
                  framework: terraform
                  output_format: cli
